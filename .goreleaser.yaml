version: 2

project_name: bimbucket

before:
  hooks:
    - go mod tidy

builds:
  - id: bimbucket
    main: ./cmd/bimbucket
    binary: bimbucket
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: bimbucket
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

nfpms:
  - id: bimbucket
    package_name: bimbucket
    vendor: Mochammad Dimas Editiya
    homepage: https://github.com/codersidprogrammer/bimbucket
    maintainer: Mochammad Dimas Editiya
    description: Migrate repositories from Bitbucket Server/Data Center to Bitbucket Cloud.
    formats:
      - deb
      - rpm
    bindir: /usr/bin

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
